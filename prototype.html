<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge · 跨境汇款最后一公里</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f9f3;color:#193f34;
font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header,main,footer{max-width:1050px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;
border-bottom:1px solid #dce5d5}
.logo{font-size:30px;font-weight:800}
.tag{background:#e5eed9;padding:8px 14px;border-radius:30px;font-size:12px}
.hero{padding:45px 0 25px}
small{color:#71865d;letter-spacing:2px}
h1{font-size:clamp(38px,7vw,64px);line-height:1.15;margin:20px 0}
h1 span{color:#7a955d}
p{line-height:1.7;color:#74806c}
.notice{padding:16px;background:#edf3e3;border:1px solid #dbe5ce;
border-radius:10px;font-size:13px}
.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin:30px 0}
h2{font-size:23px;margin:0 0 20px}
.filters{display:flex;gap:12px;margin-bottom:18px}
label{display:block;font-size:13px;color:#52634b;flex:1}
select,input{width:100%;padding:12px;margin:8px 0 15px;
border:1px solid #d7e0ce;border-radius:7px;background:white;
color:#193f34;font:inherit}
.card,.panel{background:white;border:1px solid #dce5d5;
border-radius:12px;padding:22px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px}
.card p{font-size:13px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.balance{font-size:24px;font-weight:700}
.badge{font-size:11px;background:#edf4e5;color:#628148;
padding:6px 10px;border-radius:20px;white-space:nowrap}
.unavailable{background:#f4eee5;color:#947750}
button{padding:11px 15px;border:1px solid #d6e1cb;
border-radius:7px;background:white;color:#285e43;cursor:pointer;font:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){background:#edf4e5}
.primary{background:#193f34;color:white;width:100%;margin-top:15px}
.primary:hover:not(:disabled){background:#2c674c}
.help{font-size:12px}
#message{font-size:13px;line-height:1.6;color:#9a4432}
#message.success{color:#286746}
.empty{border:1px dashed #ccd9be;border-radius:10px;
text-align:center;padding:25px;color:#7d896f}
.reservation{padding:18px;background:white;border:1px solid #dce5d5;
border-radius:9px;margin:12px 0}
.reservation p{font-size:12px;margin:7px 0}
footer{border-top:1px solid #dce5d5;font-size:12px;color:#7d896f}
:focus-visible{outline:3px solid #90ad6e;outline-offset:3px}
@media(max-width:700px){
.layout{grid-template-columns:1fr}
header,main,footer{padding:20px}
.row{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
<div class="logo">↗ bridge.</div>
<span class="tag">● 模拟演示</span>
</header>
<main>
<section class="hero">
<small>STELLAR 创新挑战 · 最后一公里</small>
<h1>让跨境汇款，<br><span>走到家门口。</span></h1>
<p>寻找本地现金提取代理，查看模拟现金余额，提前预约领取。</p>
</section>

<p class="notice">
这是一个前端概念演示。代理地址和现金余额均为虚构，
不涉及真实资金、钱包、私钥或 Stellar 链上交易。
金额统一使用菲律宾比索 PHP。
</p>

<div class="layout">
<section>
<h2>寻找现金提取代理</h2>
<div class="filters">
<label>所在城市
<select id="city">
<option value="all">所有城市</option>
<option>Manila</option>
<option>Quezon City</option>
<option>Makati</option>
</select>
</label>
<label>现金状态
<select id="availability">
<option value="all">所有代理</option>
<option value="available">可预约</option>
</select>
</label>
</div>
<p id="count" class="help"></p>
<div id="agents"></div>
</section>

<aside class="panel">
<h2>预约提取现金</h2>
<p>出发之前，先确认现金可用。</p>
<form id="form">
<label>提取代理
<select id="agent" required>
<option value="">请选择代理</option>
</select>
</label>
<label>提取金额（PHP）
<input id="amount" type="number" min="100" step="1"
placeholder="例如：2000" required>
</label>
<p class="help">最低 ₱100，只接受整数金额。</p>
<p class="notice">预约有效期为 30 分钟。取消或过期后，模拟余额会恢复。</p>
<button class="primary" type="submit">提交模拟预约 ↗</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<p class="help">无需注册，无需付款。</p>
</aside>
</div>

<section>
<div class="row">
<h2>我的预约</h2>
<button id="reset" type="button">重置演示</button>
</div>
<div id="reservations"></div>
</section>
</main>
<footer>
Bridge · 连接全球价值与本地生活。数据仅保存在当前页面，刷新后重置。
</footer>

<script>
const initialAgents = [
  {id:"luna",name:"Luna Neighborhood Store",
   city:"Manila",address:"128 Mabini Street, Ermita",cash:15000},
  {id:"bayan",name:"Bayan Remittance Center",
   city:"Quezon City",address:"42 Maginhawa Street, Diliman",cash:8500},
  {id:"sari",name:"Sari-Sari Express",
   city:"Makati",address:"76 J.P. Rizal Street, Poblacion",cash:3200},
  {id:"corner",name:"The Corner Cash Point",
   city:"Manila",address:"19 Pedro Gil Street, Paco",cash:0}
];

let agents = initialAgents.map(agent => ({...agent}));
let reservations = [];
let nextReference = 1;

const get = id => document.getElementById(id);
const money = value => "₱" + value.toLocaleString("en-PH");
const statusNames = {
  active:"预约成功",cancelled:"已取消",expired:"已过期"
};

function showMessage(text, success = false) {
  get("message").textContent = text;
  get("message").className = success ? "success" : "";
}

function render() {
  const selected = get("agent").value;
  const visible = agents.filter(agent =>
    (get("city").value === "all" ||
     agent.city === get("city").value) &&
    (get("availability").value === "all" || agent.cash >= 100)
  );

  get("count").textContent = "找到 " + visible.length + " 个模拟代理";

  // 此处插入的代理名称和地址全部来自上方固定演示数据。
  get("agents").innerHTML = visible.length
    ? visible.map(agent => `
      <article class="card">
        <div class="row">
          <h3>${agent.name}</h3>
          <span class="badge ${agent.cash < 100 ? "unavailable" : ""}">
            ${agent.cash >= 100 ? "现金可用" : "暂不可用"}
          </span>
        </div>
        <p>${agent.address} · ${agent.city}</p>
        <p>模拟可提取余额</p>
        <div class="row">
          <span class="balance">${money(agent.cash)}</span>
          <button type="button" data-agent="${agent.id}"
            ${agent.cash < 100 ? "disabled" : ""}>选择代理 ↗</button>
        </div>
      </article>
    `).join("")
    : '<p class="empty">没有符合条件的代理，请调整筛选条件。</p>';

  get("agent").replaceChildren(
    new Option("请选择代理", ""),
    ...agents.map(agent => {
      const option = new Option(
        agent.name + " · " + money(agent.cash), agent.id
      );
      option.disabled = agent.cash < 100;
      return option;
    })
  );
  get("agent").value = selected;

  get("reservations").innerHTML = reservations.length
    ? reservations.map(reservation => {
      const agent = agents.find(a => a.id === reservation.agentId);
      const expiry = new Date(reservation.expires).toLocaleTimeString(
        "zh-CN", {hour:"2-digit", minute:"2-digit"}
      );
      return `
        <article class="reservation">
          <div class="row">
            <strong>${money(reservation.amount)} · ${agent.name}</strong>
            <span class="badge">${statusNames[reservation.status]}</span>
          </div>
          <p>演示编号：${reservation.id}</p>
          ${reservation.status === "active" ? `
            <p>有效期至 ${expiry}，仅用于模拟演示。</p>
            <button type="button"
              data-cancel="${reservation.id}">取消预约</button>
          ` : ""}
        </article>
      `;
    }).join("")
    : '<p class="empty">暂无预约。选择代理后即可体验。</p>';
}

function expireReservations() {
  let changed = false;
  reservations.forEach(reservation => {
    if (reservation.status === "active" &&
        reservation.expires <= Date.now()) {
      reservation.status = "expired";
      agents.find(a => a.id === reservation.agentId).cash
        += reservation.amount;
      changed = true;
    }
  });
  if (changed) {
    render();
    showMessage("有预约已过期，对应模拟余额已恢复。");
  }
}

get("city").addEventListener("change", render);
get("availability").addEventListener("change", render);

get("agents").addEventListener("click", event => {
  const button = event.target.closest("[data-agent]");
  if (!button) return;
  get("agent").value = button.dataset.agent;
  showMessage("");
  get("amount").focus();
});

get("form").addEventListener("submit", event => {
  event.preventDefault();
  expireReservations();

  const agent = agents.find(a => a.id === get("agent").value);
  const amount = Number(get("amount").value);

  if (!agent) return showMessage("请先选择代理。");
  if (!Number.isSafeInteger(amount) || amount < 100) {
    return showMessage("请输入至少 ₱100 的整数金额。");
  }
  if (amount > agent.cash) {
    return showMessage(
      "该代理目前只有 " + money(agent.cash) + " 可用，请减少金额或选择其他代理。"
    );
  }

  agent.cash -= amount;
  const id = "BR-" + String(nextReference++).padStart(4, "0");
  reservations.unshift({
    id,
    agentId:agent.id,
    amount,
    expires:Date.now() + 30 * 60 * 1000,
    status:"active"
  });

  render();
  get("amount").value = "";
  showMessage("模拟预约成功！编号：" + id + "。没有发生真实转账。", true);
});

get("reservations").addEventListener("click", event => {
  const button = event.target.closest("[data-cancel]");
  if (!button) return;
  expireReservations();

  const reservation = reservations.find(
    item => item.id === button.dataset.cancel
  );
  if (!reservation || reservation.status !== "active") return;

  agents.find(a => a.id === reservation.agentId).cash
    += reservation.amount;
  reservation.status = "cancelled";
  render();
  showMessage("预约已取消，模拟余额已恢复。", true);
});

get("reset").addEventListener("click", () => {
  agents = initialAgents.map(agent => ({...agent}));
  reservations = [];
  get("form").reset();
  render();
  showMessage("演示已重置。", true);
});

render();
setInterval(expireReservations, 1000);
</script>
</body>
</html>
